# harmonyrecomp - ReXGlue codegen config for Castlevania: Harmony of Despair
# with title update 2 applied (default.xex version 2.04, see build.py,
# step_title_update). Used instead of harmonyrecomp_config.toml when the
# title update is part of the build.
#
# The update replaces the whole executable: nearly every function moved
# (memcpy 0x8273A030 -> 0x827567D0, most code by +0x1C000 to +0x1C800), so
# every address of harmonyrecomp_config.toml was located again:
#  - CRT routines and sub_8279B498 (sub_8277ECF0 in 1.04) by matching their
#    instructions with immediates and branch offsets masked;
#  - the functions only reachable through pointers with the same scan that
#    produced the 1.04 lists (a compiler thunk, or a pointer in .rdata/.data,
#    in a code gap left by a first codegen pass, after a return/branch/padding
#    and ending within 64 instructions). Applied to 1.04 this scan reproduces
#    every entry of harmonyrecomp_config.toml.

# memcpy / memmove / memset (sub_8273A030 / sub_8273AD00 / sub_8273A590 in 1.04)
[rexcrt]
memcpy  = 0x827567D0
memmove = 0x827574A0
memset  = 0x82756D30

[functions]
# Network message dispatch (sub_8277ECF0 in 1.04), see harmonyrecomp_config.toml.
0x8279B498 = { end = 0x8279B5E8 }

# Compiler thunks, called through member-function pointers built in code.
0x82223170 = {}   # vcall thunk

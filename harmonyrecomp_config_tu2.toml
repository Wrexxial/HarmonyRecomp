# Byte-indexed jump table without bounds check (0x8277ED34 in 1.04, same
# table bytes at 0x82068E80): types 1..16, see harmonyrecomp_config.toml.
[[switch_tables]]
address = 0x8279B4DC
register = 11
labels = [
  0x8279B510, 0x8279B510, 0x8279B510, 0x8279B510, # 0-3   types 1-4
  0x8279B5E8, 0x8279B510, 0x8279B510, 0x8279B510, # 4-7   types 5-8
  0x8279B510, 0x8279B4E0, 0x8279B510, 0x8279B510, # 8-11  types 9-12
  0x8279B4E0, 0x8279B4E0, 0x8279B4E0, 0x8279B4E0, # 12-15 types 13-16
]
